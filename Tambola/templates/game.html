<!DOCTYPE html>
<html>
<head>
    <title>Tambola Game Board</title>
    <style>
        body { font-family: sans-serif; text-align: center; }
        .grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 5px; max-width: 600px; margin: auto; }
        .num { padding: 10px; border: 1px solid #ccc; background: white; }
        .called { background: #ffc107; font-weight: bold; }
        .current { background: #dc3545; color: white; font-size: 24px; padding: 20px; margin-bottom: 20px; border-radius: 10px; }
    </style>
</head>
<body>
    <h1>Tambola Master Board</h1>
    <div id="current-num" class="current">Ready?</div>
    <button onclick="callNext()" style="padding: 15px 30px; font-size: 18px; background: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; margin-bottom: 20px;">Call Next Number</button>
    
    <div class="grid" id="board">
        {% for i in range(1, 91) %}
            <div id="n{{i}}" class="num {% if i in called_numbers %}called{% endif %}">{{i}}</div>
        {% endfor %}
    </div>

    <script>
        function callNext() {
            fetch('/call_number', {method: 'POST'})
            .then(res => res.json())
            .then(data => {
                if(data.status === 'over') alert('Game Over!');
                else {
                    document.getElementById('current-num').innerText = "Current Number: " + data.number;
                    document.getElementById('n' + data.number).classList.add('called');
                }
            });
        }
    </script>
</body>
</html>
