<!DOCTYPE html>
<html>
<head>
<title>Admin Login</title>
<style>
body { background: linear-gradient(to right, #1e3c72, #2a5298); display:flex; justify-content:center; align-items:center; height:100vh; }
.box { background:white; padding:40px; border-radius:10px; text-align:center; }
input, button { display:block; margin:10px auto; padding:10px; width:220px; }
button { background:#1e3c72; color:white; border:none; }
</style>
</head>
<body>
<div class="box">
    <h2>Admin Login</h2>
    <form method="POST">
        <input type="text" name="username" placeholder="Username" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">Login</button>
    </form>
</div>
</body>
</html>
