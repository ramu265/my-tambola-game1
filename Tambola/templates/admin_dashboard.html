<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; background: #f4f4f4; }
        .card { background: white; padding: 20px; border-radius: 10px; display: inline-block; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        input { padding: 10px; margin: 10px; width: 80%; border: 1px solid #ccc; border-radius: 5px; }
        button { padding: 10px 20px; background: #27ae60; color: white; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Tambola Admin</h1>
    <div class="card">
        <h3>Generate Tickets</h3>
        <form action="/generate_tickets" method="POST">
            <input type="text" name="phone" placeholder="WhatsApp Number (e.g. 919876543210)" required><br>
            <input type="number" name="ticket_count" placeholder="How many tickets? (1-6)" min="1" max="6" required><br>
            <button type="submit">Send via WhatsApp</button>
        </form>
        <hr>
        <a href="/game"><button style="background: #2980b9;">Go to Game Board</button></a>
    </div>
</body>
</html>
