<!DOCTYPE html>
<html>
<head>
    <title>Your Tickets</title>
    <style>
        body { font-family: sans-serif; background: #f0f0f0; padding: 10px; }
        .history-box { background: white; padding: 15px; border-radius: 10px; margin-bottom: 20px; border: 2px solid #ffc107; }
        .num-circle { display: inline-block; width: 30px; height: 30px; background: #ffc107; border-radius: 50%; text-align: center; line-height: 30px; margin: 3px; font-weight: bold; font-size: 14px; }
        table { border-collapse: collapse; margin: 20px auto; background: white; }
        td { border: 1px solid #333; width: 40px; height: 40px; text-align: center; font-weight: bold; }
        .empty { background: #eee; }
    </style>
</head>
<body>
    <div class="history-box">
        <h3 style="margin-top: 0;">Numbers Called So Far:</h3>
        <div id="history">
            {% for num in called_numbers %}
                <span class="num-circle">{{ num }}</span>
            {% endfor %}
        </div>
    </div>

    <h2 style="text-align: center;">Your Tambola Tickets</h2>
    {% for ticket in tickets %}
        <table>
            {% for row in ticket %}
                <tr>
                    {% for col in row %}
                        <td class="{% if col == 0 %}empty{% endif %}">{% if col != 0 %}{{ col }}{% endif %}</td>
                    {% endfor %}
                </tr>
            {% endfor %}
        </table>
        <br>
    {% endfor %}

    <script>
        // ప్రతి 5 సెకన్లకు పేజీని రిఫ్రెష్ చేసి కొత్త నంబర్లు వచ్చాయో లేదో చూస్తుంది
        setTimeout(function(){ location.reload(); }, 5000);
    </script>
</body>
</html>
